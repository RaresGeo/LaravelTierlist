services:
  web:
    build:
      context: .
      dockerfile: ./docker/common/nginx/Dockerfile
      args:
        BUILD_ENV: production
    restart: unless-stopped
    env_file:
      - .env.prod
    volumes:
      - laravel-storage-production:/var/www/storage:ro
      # Uploaded images are written by php-fpm into public/images. nginx must
      # read from the SAME storage, so share a named volume instead of the
      # (empty) host directory. php-fpm mounts it rw; nginx only needs ro.
      - laravel-images-production:/var/www/public/images:ro
    networks:
      - laravel-production
    ports:
      - "${NGINX_PORT:-80}:80"
    depends_on:
      php-fpm:
        condition: service_healthy
    image: registry.${DOMAIN}/tierlist-web:latest

  php-fpm:
    build:
      context: .
      dockerfile: ./docker/common/php-fpm/Dockerfile
      target: production
    restart: unless-stopped
    volumes:
      - laravel-storage-production:/var/www/storage
      - laravel-images-production:/var/www/public/images
    env_file:
      - .env.prod
    networks:
      - laravel-production
    healthcheck:
      test: ["CMD-SHELL" ,"php-fpm-healthcheck || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
    image: registry.${DOMAIN}/tierlist-php:latest

  db:
    image: docker.io/mariadb:10.6
    restart: unless-stopped
    env_file: .env.prod
    environment:
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db-data-production:/var/lib/mysql
    networks:
      - laravel-production
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  laravel-production:

volumes:
  laravel-storage-production:
  laravel-images-production:
  db-data-production:
